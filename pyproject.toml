[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "relattrs"
version = "2.0.0"
description = "Toolkit for working with nth order relational attributes in Python classes."
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Sergio Rodríguez", email = "srodriguez3441@gmail.com"},
]
maintainers = [
    {name = "Sergio Rodríguez", email = "srodriguez3441@gmail.com"},
]
requires-python = ">=3.8"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "build",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "tox",
    "twine",
]

[project.urls]
Homepage = "https://github.com/nibblex/python-relattrs"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
relattrs = ["py.typed"]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]
addopts = "--doctest-modules"

[tool.tox]
envlist = ["py38", "py39", "py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
deps = ["pytest", "pytest-cov"]
commands = [
    ["pytest", "-q", "--cov", "--cov-report=xml"]
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
